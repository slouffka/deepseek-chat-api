<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat API</title>
    <style>
        :root {
            --primary: #007AFF;
            --surface: #FFFFFF;
            --border: #E5E5EA;
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --text-tertiary: #C7C7CC;
            --success: #34C759;
            --warning: #FF9500;
            --error: #FF3B30;
            --radius: 8px;
            --spacing: 16px;
            --spacing-sm: 8px;
            --spacing-lg: 24px;
            --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-ui);
            color: var(--text-primary);
            line-height: 1.4;
            background: #F2F2F7;
            padding: var(--spacing);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 640px;
            margin: 0 auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: var(--spacing);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing);
        }

        .header-left {
            flex: 1;
        }

        h1 {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .config-toggle {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .config-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        .config-toggle.active {
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: var(--spacing);
            border: 1px solid var(--border);
        }

        .config-card {
            overflow: hidden;
            transition: all 0.3s ease;
            max-height: 500px;
            opacity: 1;
        }

        .config-card.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border: 1px solid transparent;
            opacity: 0;
            margin-bottom: 0;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .input-group {
            margin-bottom: var(--spacing);
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 15px;
            background: var(--surface);
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: none;
            min-height: 120px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
        }

        .url-display {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: #F8F8F8;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 6px;
            word-break: break-all;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
            margin-top: var(--spacing);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #0056CC;
        }

        .btn-primary:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #F2F2F7;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #E5E5EA;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #E68A00;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .response-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        #response {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--spacing);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-y: auto;
            min-height: 150px;
            color: var(--text-primary);
        }

        .response-placeholder {
            color: var(--text-tertiary);
            font-style: italic;
        }

        .status-bar {
            position: fixed;
            bottom: var(--spacing);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            display: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }

        .status-bar.visible {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .info-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        .token-security {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 6px;
            padding: 8px;
            background: #FFF3E0;
            border-radius: 6px;
            font-size: 11px;
            color: #E65100;
        }

        .gear-icon {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .config-toggle.active .gear-icon {
            transform: rotate(90deg);
        }

        .payload-info {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: #F8F8F8;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .pow-status {
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            background: #F0F7FF;
            border-left: 3px solid var(--primary);
            display: none;
        }

        .pow-status.active {
            display: block;
        }

        .pow-status.mining {
            background: #FFF7E6;
            border-left-color: var(--warning);
        }

        .pow-status.success {
            background: #F0FFF4;
            border-left-color: var(--success);
        }

        .pow-status.error {
            background: #FFF0F0;
            border-left-color: var(--error);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-fill.mining {
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .debug-toggle {
            text-align: right;
            margin-top: 8px;
        }

        .debug-toggle button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 4px 8px;
        }

        .debug-toggle button:hover {
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }

        .debug-info {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            background: #F8F8F8;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-info.visible {
            display: block;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>DeepSeek Chat API</h1>
                <p class="subtitle">Proof-of-Work enabled interface</p>
            </div>
            <button class="config-toggle" id="configToggle" title="Toggle configuration">
                <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" />
                    <path d="M19.4 15C19.5 15.4 19.6 15.8 19.7 16.2L21.5 17.5C21.8 17.7 22 18.1 21.9 18.5L20.9 21.2C20.8 21.6 20.4 21.9 20 21.9L17.7 21.4C17.2 21.7 16.7 21.9 16.2 22.1L15.8 24.4C15.7 24.8 15.4 25.1 15 25.1H12C11.6 25.1 11.3 24.8 11.2 24.4L10.8 22.1C10.3 21.9 9.8 21.7 9.3 21.4L7 21.9C6.6 21.9 6.2 21.6 6.1 21.2L5.1 18.5C5 18.1 5.2 17.7 5.5 17.5L7.3 16.2C7.4 15.8 7.5 15.4 7.6 15L5.8 13.7C5.5 13.5 5.3 13.1 5.4 12.7L6.4 10C6.5 9.6 6.9 9.3 7.3 9.3L9.6 9.8C10.1 9.5 10.6 9.3 11.1 9.1L11.5 6.8C11.6 6.4 11.9 6.1 12.3 6.1H15.3C15.7 6.1 16 6.4 16.1 6.8L16.5 9.1C17 9.3 17.5 9.5 18 9.8L20.3 9.3C20.7 9.3 21.1 9.6 21.2 10L22.2 12.7C22.3 13.1 22.1 13.5 21.8 13.7L20 15Z" />
                </svg>
            </button>
        </header>

        <div class="card config-card" id="configCard">
            <div class="card-title">Configuration</div>
            
            <div class="input-group">
                <label for="apiUrl">API Endpoint</label>
                <select id="apiUrl">
                    <option value="http://localhost:3000">Custom URL (for CORS proxy)</option>
                    <option value="https://chat.deepseek.com/api/v0/chat/completion">Default Chat API</option>
                </select>
                <div class="url-display" id="currentUrl">http://localhost:3000</div>
                
                <div class="input-group" id="customUrlGroup" style="display: none; margin-top: 12px;">
                    <label for="customUrl">Custom Endpoint URL</label>
                    <input type="text" id="customUrl" placeholder="http://localhost:3000" value="http://localhost:3000" />
                </div>
                
                <p class="info-text">
                    Uses internal API with Proof-of-Work challenge.
                </p>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Request</div>
            <div class="input-group">
                <label for="message">Prompt (User Message)</label>
                <textarea id="message" placeholder="Enter your message...">Explain quantum computing in simple terms</textarea>
            </div>
            
            <div class="pow-status" id="powStatus">
                <div id="powMessage">Ready to solve Proof-of-Work...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="powProgress"></div>
                </div>
            </div>
            
            <div class="debug-toggle">
                <button id="debugToggle">Show Debug Info</button>
            </div>
            
            <div class="debug-info" id="debugInfo">
                Debug information will appear here...
            </div>
            
            <div class="controls">
                <button class="btn-secondary" id="clearBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    New Chat
                </button>
                <button class="btn-primary" id="sendBtn">
                    Send Request
                </button>
            </div>
        </div>

        <div class="card response-container">
            <div class="card-title">Response</div>
            <div id="response" class="response-placeholder">Response will appear here...</div>
        </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <!-- Web Worker code will be created from Blob -->

    <script>
        // ==============================
        // MAIN APPLICATION CODE
        // ==============================

        // DOM Elements
        const configToggle = document.getElementById('configToggle');
        const configCard = document.getElementById('configCard');
        const apiUrlSelect = document.getElementById('apiUrl');
        const customUrlGroup = document.getElementById('customUrlGroup');
        const customUrlInput = document.getElementById('customUrl');
        const currentUrlDisplay = document.getElementById('currentUrl');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const responseDisplay = document.getElementById('response');
        const statusBar = document.getElementById('statusBar');
        const powStatus = document.getElementById('powStatus');
        const powMessage = document.getElementById('powMessage');
        const powProgress = document.getElementById('powProgress');
        const debugToggle = document.getElementById('debugToggle');
        const debugInfo = document.getElementById('debugInfo');

        // In your HTML app's configuration section
        const SMART_PROXY_BASE = 'http://localhost:3000'; // Your proxy URL

        // Default endpoint
        const CHALLENGE_ENDPOINT = `${SMART_PROXY_BASE}/api/v0/chat/create_pow_challenge`;
        const COMPLETION_ENDPOINT = `${SMART_PROXY_BASE}/api/v0/chat/completion`;
        const CREATE_ENDPOINT = `${SMART_PROXY_BASE}/api/v0/chat_session/create`;

        // Application state
        let configExpanded = localStorage.getItem('configExpanded') !== 'false';
        let powWorker = null;
        let debugEnabled = false;

        // ==============================
        // UTILITY FUNCTIONS
        // ==============================

        // Generate UUID
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Generate client_stream_id in format: YYYYMMDD-randomhex
        function generateClientStreamId() {
            // Part 1: Current date in YYYYMMDD format
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const datePart = `${year}${month}${day}`;
            
            // Part 2: 16-character hex string (8 bytes = 16 hex chars)
            // Using cryptographically secure random values
            const randomBytes = new Uint8Array(8);
            crypto.getRandomValues(randomBytes);
            const randomPart = Array.from(randomBytes)
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');
            
            return `${datePart}-${randomPart}`;
        }

        // Show status message
        function showStatus(message, type = 'info') {
            statusBar.textContent = message;
            statusBar.className = 'status-bar visible';
            
            if (type === 'error') {
                statusBar.style.background = 'rgba(255, 59, 48, 0.9)';
            } else if (type === 'success') {
                statusBar.style.background = 'rgba(52, 199, 89, 0.9)';
            } else if (type === 'warning') {
                statusBar.style.background = 'rgba(255, 149, 0, 0.9)';
            } else {
                statusBar.style.background = 'rgba(0, 0, 0, 0.8)';
            }
            
            setTimeout(() => {
                statusBar.classList.remove('visible');
            }, 3000);
        }

        // Update PoW status display
        function updatePowStatus(message, type = 'info', progress = 0) {
            powStatus.className = 'pow-status active ' + type;
            powMessage.textContent = message;
            powProgress.className = 'progress-fill';
            powProgress.style.width = progress + '%';
            
            if (type === 'mining') {
                powProgress.classList.add('mining');
            }
        }

        // Add debug log
        function addDebugLog(message, data = null) {
            if (!debugEnabled) return;
            
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${timestamp}] ${message}`;
            
            if (data) {
                const dataEntry = document.createElement('pre');
                dataEntry.textContent = JSON.stringify(data, null, 2);
                dataEntry.style.fontSize = '9px';
                dataEntry.style.marginTop = '4px';
                logEntry.appendChild(dataEntry);
            }
            
            debugInfo.appendChild(logEntry);
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        // ==============================
        // PROOF-OF-WORK WORKER
        // ==============================

        // Create Web Worker from Blob
        // Updated worker code with SHA3-256 implementation
        const workerCode = `
            // ==============================
            // SHA3-256 IMPLEMENTATION (Pure JavaScript)
            // ==============================

            self.importScripts('https://cdnjs.cloudflare.com/ajax/libs/js-sha3/0.9.3/sha3.min.js');

            // Keccak (SHA3) implementation - works in all browsers
            class SHA3 {
                static keccak(b, r, message, s, d) {
                    // Keccak state
                    const state = new Array(25).fill(0n);
                    const blockSize = r / 8;
                    const messageBytes = SHA3.textToBytes(message);
                    
                    // Absorb phase
                    for (let i = 0; i < messageBytes.length; i += blockSize) {
                        const block = messageBytes.slice(i, i + blockSize);
                        for (let j = 0; j < block.length; j++) {
                            const index = Math.floor(j / 8);
                            const shift = BigInt((j % 8) * 8);
                            state[index] ^= BigInt(block[j]) << shift;
                        }
                        SHA3.keccakF(state);
                    }
                    
                    // Padding
                    const padding = new Uint8Array(blockSize);
                    padding[0] = s;
                    padding[blockSize - 1] |= 0x80;
                    
                    for (let j = 0; j < padding.length; j++) {
                        const index = Math.floor(j / 8);
                        const shift = BigInt((j % 8) * 8);
                        state[index] ^= BigInt(padding[j]) << shift;
                    }
                    SHA3.keccakF(state);
                    
                    // Squeeze phase
                    const output = [];
                    const outputBytes = d / 8;
                    let offset = 0;
                    
                    while (output.length < outputBytes) {
                        for (let i = 0; i < 8 && offset < 25; i++) {
                            const lane = state[offset];
                            for (let j = 0; j < 8 && output.length < outputBytes; j++) {
                                output.push(Number((lane >> BigInt(j * 8)) & 0xffn));
                            }
                            offset++;
                        }
                        if (output.length < outputBytes) {
                            SHA3.keccakF(state);
                        }
                    }
                    
                    return SHA3.bytesToHex(output.slice(0, outputBytes));
                }
                
                static keccakF(state) {
                    // Keccak-f[1600] permutation
                    const rounds = 24;
                    const RC = [
                        0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an,
                        0x8000000080008000n, 0x000000000000808bn, 0x0000000080000001n,
                        0x8000000080008081n, 0x8000000000008009n, 0x000000000000008an,
                        0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
                        0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n,
                        0x8000000000008003n, 0x8000000000008002n, 0x8000000000000080n,
                        0x000000000000800an, 0x800000008000000an, 0x8000000080008081n,
                        0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n
                    ];
                    
                    for (let round = 0; round < rounds; round++) {
                        // Theta
                        const C = new Array(5).fill(0n);
                        const D = new Array(5).fill(0n);
                        
                        for (let x = 0; x < 5; x++) {
                            C[x] = state[x] ^ state[x + 5] ^ state[x + 10] ^ state[x + 15] ^ state[x + 20];
                        }
                        
                        for (let x = 0; x < 5; x++) {
                            D[x] = C[(x + 4) % 5] ^ SHA3.rot64(C[(x + 1) % 5], 1);
                        }
                        
                        for (let x = 0; x < 5; x++) {
                            for (let y = 0; y < 5; y++) {
                                state[x + 5 * y] ^= D[x];
                            }
                        }
                        
                        // Rho and Pi
                        let x = 1, y = 0;
                        let current = state[1];
                        
                        for (let t = 0; t < 24; t++) {
                            const newX = y;
                            const newY = (2 * x + 3 * y) % 5;
                            const temp = state[newX + 5 * newY];
                            
                            state[newX + 5 * newY] = SHA3.rot64(current, ((t + 1) * (t + 2) / 2) % 64);
                            current = temp;
                            x = newX;
                            y = newY;
                        }
                        
                        // Chi
                        for (let y = 0; y < 5; y++) {
                            const T = new Array(5);
                            for (let x = 0; x < 5; x++) {
                                T[x] = state[x + 5 * y];
                            }
                            for (let x = 0; x < 5; x++) {
                                state[x + 5 * y] = T[x] ^ ((~T[(x + 1) % 5]) & T[(x + 2) % 5]);
                            }
                        }
                        
                        // Iota
                        state[0] ^= RC[round];
                    }
                }
                
                static rot64(x, n) {
                    n = n % 64;
                    return (x << BigInt(n)) | (x >> BigInt(64 - n));
                }
                
                static textToBytes(text) {
                    const bytes = new Uint8Array(text.length * 4);
                    const encoder = new TextEncoder();
                    const encoded = encoder.encode(text);
                    bytes.set(encoded);
                    return Array.from(bytes.slice(0, encoded.length));
                }
                
                static bytesToHex(bytes) {
                    return bytes.map(b => b.toString(16).padStart(2, '0')).join('');
                }
            }
            
            // ==============================
            // MINING FUNCTIONS
            // ==============================
            
            // Calculate target value: target = (2^256 - 1) / difficulty
            function calculateTarget(difficulty) {
                const MAX_HASH_VALUE = 2n ** 256n - 1n;
                const difficultyBigInt = BigInt(difficulty);
                return MAX_HASH_VALUE / difficultyBigInt;
            }
            
            // Hash to BigInt (using our SHA3 implementation)
            function sha3_256ToBigInt(message) {
                const hashHex = self.sha3_256(message);
                return BigInt('0x' + hashHex);
            }
            
            // Main mining function
            async function solvePowChallenge(challenge, salt, difficulty, challengeSignature) {
                const target = calculateTarget(difficulty);
                let nonce = 0;
                const startTime = Date.now();
                const maxNonce = 1000000; // Reduced for browser safety
                
                // Report progress
                let lastReport = 0;
                let hashesPerSecond = 0;
                let lastTime = startTime;
                
                console.log(\`Worker: Starting PoW (difficulty: \${difficulty}, target: \${target})\`);
                
                while (nonce < maxNonce) {
                    const inputString = challenge + salt + nonce.toString();
                    const hashBigInt = sha3_256ToBigInt(inputString);
                    
                    // Check if hash < target
                    if (hashBigInt < target) {
                        const elapsed = Date.now() - startTime;
                        console.log(\`Worker: Solved! Nonce: \${nonce}, Time: \${elapsed}ms\`);
                        
                        // Calculate final signature
                        const finalSignatureInput = challengeSignature + nonce.toString();
                        const finalSignature = self.sha3_256(finalSignatureInput);
                        
                        return {
                            answer: nonce,
                            signature: finalSignature,
                            time: elapsed,
                            iterations: nonce + 1,
                            hashRate: Math.round((nonce + 1) / (elapsed / 1000))
                        };
                    }
                    
                    nonce++;
                    
                    // Report progress every 5000 iterations
                    if (nonce - lastReport >= 5000) {
                        lastReport = nonce;
                        const currentTime = Date.now();
                        const elapsedSinceLast = currentTime - lastTime;
                        hashesPerSecond = elapsedSinceLast > 0 ? Math.round(5000 / (elapsedSinceLast / 1000)) : 0;
                        lastTime = currentTime;
                        
                        const progress = Math.min(100, (nonce / 500000) * 100);
                        
                        self.postMessage({
                            type: 'progress',
                            progress: progress,
                            nonce: nonce,
                            elapsed: currentTime - startTime,
                            hashRate: hashesPerSecond
                        });
                    }
                }
                
                throw new Error(\`Could not find solution within \${maxNonce} iterations\`);
            }
            
            // ==============================
            // WORKER MESSAGE HANDLER
            // ==============================
            
            self.onmessage = async function(e) {
                const { challenge, salt, difficulty, challengeSignature } = e.data;
                
                try {
                    console.log(\`Worker: Received challenge: \${challenge.substring(0, 16)}...\`);
                    self.postMessage({ type: 'started' });
                    
                    const result = await solvePowChallenge(
                        challenge,
                        salt,
                        difficulty,
                        challengeSignature
                    );
                    
                    self.postMessage({
                        type: 'solved',
                        ...result
                    });
                } catch (error) {
                    console.error(\`Worker error: \`, error);
                    self.postMessage({
                        type: 'error',
                        error: error.message
                    });
                }
            };
            
            console.log('Worker: SHA3-256 miner loaded and ready');
        `;

        // Function to create the worker with the new code
        function createPowWorker() {
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            return new Worker(URL.createObjectURL(blob));
        }

        // ==============================
        // API FUNCTIONS
        // ==============================

        // Request PoW challenge from server
        async function requestPowChallenge() {
            updatePowStatus('Requesting PoW challenge...', 'info', 0);
            addDebugLog('Requesting PoW challenge');
            
            try {
                const response = await fetch(CHALLENGE_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-client-version': '1.5.0',
                        'x-app-version': '20241129.1',
                        'x-client-platform': 'web',
                        'x-client-locale': 'en_US',
                        'x-debug-model-channel': 'prod',
                        'x-debug-lite-model-channel': 'prod',
                        'Referer': 'https://chat.deepseek.com/',
                        'Origin': 'https://chat.deepseek.com'
                    },
                    body: JSON.stringify({
                        target_path: '/api/v0/chat/completion'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Challenge request failed: ${response.status}`);
                }

                const result = await response.json();
                addDebugLog('Received PoW challenge', result);
                
                // Navigate through nested response structure
                const challengeData = result.data?.biz_data?.challenge;
                if (!challengeData) {
                    throw new Error('Invalid challenge response structure');
                }
                
                // Check if challenge is expired
                if (challengeData.expire_at < Date.now()) {
                    throw new Error('Challenge expired');
                }
                
                return challengeData;
            } catch (error) {
                updatePowStatus(`Error: ${error.message}`, 'error', 0);
                throw error;
            }
        }

        // Solve PoW challenge using Web Worker
        function solvePowWithWorker(challengeData) {
            return new Promise((resolve, reject) => {
                if (!powWorker) {
                    powWorker = createPowWorker();
                }
                
                // Set up message handler
                powWorker.onmessage = function(e) {
                    const data = e.data;
                    
                    switch (data.type) {
                        case 'started':
                            updatePowStatus('Mining for solution...', 'mining', 0);
                            addDebugLog('PoW mining started');
                            break;
                            
                        case 'progress':
                            updatePowStatus(
                                `Mining... (${data.nonce} attempts, ${data.elapsed}ms)`,
                                'mining',
                                data.progress
                            );
                            break;
                            
                        case 'solved':
                            updatePowStatus(
                                `Solved! Answer: ${data.answer} (${data.iterations} iterations in ${data.time}ms)`,
                                'success',
                                100
                            );
                            addDebugLog('PoW solved', data);
                            
                            // Construct final PoW response
                            const powResponse = {
                                algorithm: challengeData.algorithm,
                                challenge: challengeData.challenge,
                                salt: challengeData.salt,
                                answer: data.answer,
                                signature: data.signature,
                                target_path: challengeData.target_path
                            };
                            
                            resolve({
                                powHeader: btoa(JSON.stringify(powResponse)),
                                iterations: data.iterations,
                                time: data.time
                            });
                            break;
                            
                        case 'error':
                            updatePowStatus(`Mining error: ${data.error}`, 'error', 0);
                            reject(new Error(data.error));
                            break;
                    }
                };
                
                // Start the worker
                powWorker.postMessage({
                    challenge: challengeData.challenge,
                    salt: challengeData.salt,
                    difficulty: challengeData.difficulty,
                    challengeSignature: challengeData.signature
                });
            });
        }

        // Replace your current session state variable with this object
        let currentConversation = {
            sessionId: null,      // The chat_session_id from createChatSession()
            lastResponseId: null  // The response_message_id from the last AI reply
        };

        // Function to start a brand new conversation
        async function startNewConversation() {
            try {
                const newSessionId = await createChatSession();
                currentConversation = {
                    sessionId: newSessionId,
                    lastResponseId: null // This will be null for the first message
                };
                console.log('Started new conversation:', currentConversation);
                return newSessionId;
            } catch (error) {
                console.error('Failed to start new conversation:', error);
                throw error;
            }
        }

        // Function to get the correct parent_message_id for the next request
        function getParentMessageId() {
            // For the first message, parent_message_id should be null
            // For subsequent messages, use the last AI response ID
            return currentConversation.lastResponseId;
        }

        // After receiving a streamed response, update the lastResponseId
        function updateConversationWithResponse(responseMessageId) {
            if (responseMessageId && responseMessageId > 0) {
                currentConversation.lastResponseId = responseMessageId;
                console.log('Updated last response ID to:', responseMessageId);
            }
        }

        /**
         * Creates a new chat session with DeepSeek.
         * @returns {Promise<string>} - The new chat_session_id.
         */
        async function createChatSession() {
            const response = await fetch(CREATE_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-client-version': '1.5.0',
                    'x-app-version': '20241129.1',
                    'x-client-platform': 'web',
                    'x-client-locale': 'en_US',
                    'x-debug-model-channel': 'prod',
                    'x-debug-lite-model-channel': 'prod',
                    'Referer': 'https://chat.deepseek.com/',
                    'Origin': 'https://chat.deepseek.com'
                },
                body: JSON.stringify({})
            });

            if (!response.ok) {
                throw new Error(`Failed to create session: ${response.status}`);
            }

            const data = await response.json();
            // Navigate the nested response to get the session ID
            const sessionId = data.data?.biz_data?.id;
            if (!sessionId) {
                throw new Error('Could not extract session ID from response');
            }
            console.log('Created new chat session:', sessionId);
            return sessionId;
        }

        // Send chat completion request with PoW header
        async function sendChatCompletion(message, powHeader) {
            updatePowStatus('Sending chat request...', 'info', 100);
            addDebugLog('Sending chat completion request');
            
            const requestPayload = {
                chat_session_id: currentConversation.sessionId,
                parent_message_id: getParentMessageId(),
                prompt: message,
                ref_file_ids: [],
                thinking_enabled: true,
                search_enabled: true,
                client_stream_id: generateClientStreamId()
            };
            
            addDebugLog('Request payload', requestPayload);
            addDebugLog('PoW header (decoded)', JSON.parse(atob(powHeader)));
            
            const response = await fetch(COMPLETION_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-ds-pow-response': powHeader,
                    'x-client-version': '1.5.0',
                    'x-app-version': '20241129.1',
                    'x-client-platform': 'web',
                    'x-client-locale': 'en_US',
                    'x-debug-model-channel': 'prod',
                    'x-debug-lite-model-channel': 'prod',
                    'Referer': 'https://chat.deepseek.com/',
                    'Origin': 'https://chat.deepseek.com'
                },
                body: JSON.stringify(requestPayload)
            });
            
            addDebugLog('Response status', response.status);
            
            if (!response.ok) {
                const errorText = await response.text();
                addDebugLog('Error response', errorText);
                throw new Error(`API error ${response.status}: ${errorText}`);
            }

            // Check if response is streaming (Server-Sent Events)
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('text/event-stream')) {
                // Parse the SSE stream to get response_message_id
                const { responseMessageId, fullResponse } = await parseStreamResponse(response);
                updateConversationWithResponse(responseMessageId);

                // Display fullResponse to user
                return fullResponse;
            } else {
                // Fallback for non-streaming (shouldn't happen with DeepSeek)
                const data = await response.json();
                addDebugLog('Non streaming response:', data);
                return data;
                // ... handle JSON response
            }
            
        }

        // ==============================
        // MAIN REQUEST HANDLER
        // ==============================

        async function sendRequest() {
            const message = messageInput.value.trim();
            if (!message) {
                showStatus('Please enter a message', 'error');
                messageInput.focus();
                return;
            }

            // Prepare UI
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="spinner"></span> Processing...';
            responseDisplay.textContent = 'Working...';
            responseDisplay.className = '';

            try {
                if (!currentConversation.sessionId) {
                    await startNewConversation();
                    showStatus('New chat session started', 'info');
                }

                // Step 1: Request PoW challenge
                const challengeData = await requestPowChallenge();
                
                // Step 2: Solve PoW
                const { powHeader, iterations, time } = await solvePowWithWorker(challengeData);
                
                // Step 3: Send chat completion
                const result = await sendChatCompletion(message, powHeader);
                
                // Step 4: Display result
                if (result.choices && result.choices.length > 0) {
                    const reply = result.choices[0].message.content;
                    responseDisplay.textContent = reply;
                    
                    // Add token usage if available
                    if (result.usage) {
                        responseDisplay.textContent += `\n\n--- Token Usage ---\nPrompt: ${result.usage.prompt_tokens} | Completion: ${result.usage.completion_tokens} | Total: ${result.usage.total_tokens}`;
                    }
                    
                    showStatus(`Success! PoW solved in ${time}ms (${iterations} iterations)`, 'success');
                } else if (result.message || result.content) {
                    responseDisplay.textContent = result.message || result.content;
                    showStatus('Success!', 'success');
                } else {
                    responseDisplay.textContent = JSON.stringify(result, null, 2);
                    showStatus('Success!', 'success');
                }
                
            } catch (error) {
                console.error('Request failed:', error);
                responseDisplay.textContent = `Error: ${error.message}`;
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Request';
            }
        }

        // ==============================
        // UI EVENT HANDLERS
        // ==============================

        // Initialize config state
        function initializeConfigState() {
            if (!configExpanded) {
                configCard.classList.add('collapsed');
                configToggle.classList.remove('active');
            } else {
                configCard.classList.remove('collapsed');
                configToggle.classList.add('active');
            }
        }

        // Toggle configuration visibility
        configToggle.addEventListener('click', () => {
            configExpanded = !configExpanded;
            
            if (configExpanded) {
                configCard.classList.remove('collapsed');
                configToggle.classList.add('active');
                showStatus('Configuration expanded', 'info');
            } else {
                configCard.classList.add('collapsed');
                configToggle.classList.remove('active');
                showStatus('Configuration collapsed', 'info');
            }
            
            localStorage.setItem('configExpanded', configExpanded);
        });

        // Handle API URL selection
        apiUrlSelect.addEventListener('change', function() {
            if (this.value === '') {
                customUrlGroup.style.display = 'block';
                currentUrlDisplay.textContent = 'Waiting for custom URL...';
            } else {
                customUrlGroup.style.display = 'none';
                currentUrlDisplay.textContent = this.value;
            }
        });

        // Update URL display when custom URL changes
        customUrlInput.addEventListener('input', function() {
            if (this.value.trim()) {
                currentUrlDisplay.textContent = this.value;
            } else {
                currentUrlDisplay.textContent = 'Waiting for custom URL...';
            }
        });

        // Get the current endpoint URL
        function getEndpointUrl() {
            if (apiUrlSelect.value === '' && customUrlInput.value.trim()) {
                return customUrlInput.value.trim();
            }
            return apiUrlSelect.value || COMPLETION_ENDPOINT;
        }

        // Clear response and start new chat
        async function clearResponse() {
            responseDisplay.textContent = 'Response will appear here...';
            responseDisplay.className = 'response-placeholder';
            powStatus.className = 'pow-status';
            debugInfo.innerHTML = 'Debug information will appear here...';
            
            // Reset session for new conversation
            await startNewConversation();
            
            // Terminate existing worker
            if (powWorker) {
                powWorker.terminate();
                powWorker = null;
            }
            
            showStatus('New chat session started', 'info');
        }

        // Toggle debug info
        debugToggle.addEventListener('click', () => {
            debugEnabled = !debugEnabled;
            debugToggle.textContent = debugEnabled ? 'Hide Debug Info' : 'Show Debug Info';
            debugInfo.classList.toggle('visible', debugEnabled);
        });

        // Event listeners
        sendBtn.addEventListener('click', sendRequest);
        clearBtn.addEventListener('click', clearResponse);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendRequest();
            }
            if (e.key === 'Escape') {
                clearResponse();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                configToggle.click();
                e.preventDefault();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                debugToggle.click();
                e.preventDefault();
            }
        });

        // Example messages on double-click
        messageInput.addEventListener('dblclick', () => {
            const examples = [
                "Explain quantum computing in simple terms",
                "Write a Python function to calculate Fibonacci numbers",
                "What are the benefits of renewable energy?",
                "How does machine learning work?",
                "Create a short poem about technology"
            ];
            messageInput.value = examples[Math.floor(Math.random() * examples.length)];
            showStatus('Example loaded', 'info');
        });

        // ==============================
        // INITIALIZATION
        // ==============================

        window.addEventListener('DOMContentLoaded', () => {
            // Load token from URL hash if present
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            // Pre-fill with proxy URL for convenience
            customUrlInput.value = 'http://localhost:3000';
            
            // Update URL display initially
            currentUrlDisplay.textContent = getEndpointUrl();
            
            // Initialize config state
            initializeConfigState();
            
            // Show welcome message
            showStatus('Ready. Enter message to begin.', 'info');
        });
    </script>
