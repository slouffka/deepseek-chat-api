<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat API</title>
    <style>
        :root {
            --primary: #007AFF;
            --surface: #FFFFFF;
            --background: #F2F2F7;
            --border: #E5E5EA;
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --text-tertiary: #C7C7CC;
            --success: #34C759;
            --warning: #FF9500;
            --error: #FF3B30;
            --radius: 8px;
            --spacing: 16px;
            --spacing-sm: 8px;
            --spacing-lg: 24px;
            --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        }

        [data-theme="dark"] {
            --primary: #0A84FF;
            --surface: #1C1C1E;
            --background: #000000;
            --border: #38383A;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --text-tertiary: #48484A;
            --success: #30D158;
            --warning: #FF9F0A;
            --error: #FF453A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-ui);
            color: var(--text-primary);
            line-height: 1.4;
            background: var(--background);
            padding: var(--spacing);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 640px;
            margin: 0 auto;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: var(--spacing);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing);
        }

        .header-left {
            flex: 1;
        }

        h1 {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(125, 125, 125, 0.1);
            color: var(--text-primary);
        }

        .config-toggle.active {
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: var(--spacing);
            border: 1px solid var(--border);
        }

        .config-card {
            overflow: hidden;
            transition: all 0.3s ease;
            max-height: 500px;
            opacity: 1;
        }

        .config-card.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border: 1px solid transparent;
            opacity: 0;
            margin-bottom: 0;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .input-group {
            margin-bottom: var(--spacing);
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 15px;
            background: var(--surface);
            color: var(--text-primary);
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-secondary);
            opacity: 1;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: none;
            min-height: 120px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
        }

        .url-display {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(125, 125, 125, 0.1);
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 6px;
            word-break: break-all;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
            margin-top: var(--spacing);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #0056CC;
        }

        .btn-primary:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-stop {
            background: var(--error);
            color: white;
            padding: 10px;
            width: 44px; /* Square-ish */
        }
        
        .btn-stop:hover {
            background: #D32F2F;
        }

        .btn-secondary {
            background: rgba(125, 125, 125, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(125, 125, 125, 0.2);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #E68A00;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* CHAT UI STYLES */
        .chat-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            padding: 0; /* Remove default padding for full-width look */
            background: var(--surface);
            overflow: hidden; /* Contain children */
        }

        .chat-header {
            padding: var(--spacing);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(125, 125, 125, 0.05);
        }

        .chat-message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .chat-message.user {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .chat-message.assistant {
            align-self: flex-start;
            background-color: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
            font-family: var(--font-ui);
        }

        /* Thinking Block Styles */
        .thinking-block {
            margin-bottom: 12px;
            border-left: 3px solid var(--border);
            padding-left: 14px;
            background: linear-gradient(to right, rgba(125,125,125,0.05), transparent);
            border-radius: 4px;
            padding: 8px 8px 8px 14px;
        }

        .thinking-block details > summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            user-select: none;
            list-style: none; /* Hide default triangle */
        }
        
        .thinking-block details > summary::-webkit-details-marker {
            display: none;
        }
        
        .thinking-block details > summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 6px;
            font-size: 10px;
            transition: transform 0.2s;
        }

        .thinking-block details[open] > summary::before {
            transform: rotate(90deg);
        }

        .thinking-content {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            white-space: pre-wrap;
            line-height: 1.5;
            background: rgba(125, 125, 125, 0.05);
            padding: 8px;
            border-radius: 6px;
        }

        .message-role-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            margin-left: 4px;
            text-transform: uppercase;
        }

        .chat-message.user + .message-role-label {
            text-align: right;
            margin-right: 4px;
            margin-left: 0;
        }

        /* Token usage in bubble */
        .token-usage {
            font-size: 10px;
            margin-top: 8px;
            opacity: 0.7;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 4px;
        }
        
        .chat-message.user .token-usage {
             border-top: 1px solid rgba(255,255,255,0.2);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 32px;
        }

        .input-area {
            padding: var(--spacing);
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .status-bar {
            position: fixed;
            bottom: var(--spacing);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            display: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }

        .status-bar.visible {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .info-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        .token-security {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 6px;
            padding: 8px;
            background: rgba(255, 149, 0, 0.1);
            border-radius: 6px;
            font-size: 11px;
            color: var(--warning);
        }

        .gear-icon {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .config-toggle.active .gear-icon {
            transform: rotate(90deg);
        }

        .payload-info {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(125, 125, 125, 0.1);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .pow-status {
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            background: rgba(0, 122, 255, 0.1);
            border-left: 3px solid var(--primary);
            display: none;
        }

        .pow-status.active {
            display: block;
        }

        .pow-status.mining {
            background: rgba(255, 149, 0, 0.1);
            border-left-color: var(--warning);
        }

        .pow-status.success {
            background: rgba(52, 199, 89, 0.1);
            border-left-color: var(--success);
        }

        .pow-status.error {
            background: rgba(255, 59, 48, 0.1);
            border-left-color: var(--error);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-fill.mining {
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .debug-toggle {
            text-align: right;
            margin-top: 8px;
        }

        .debug-toggle button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 4px 8px;
        }

        .debug-toggle button:hover {
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }

        .debug-info {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            background: rgba(125, 125, 125, 0.1);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-info.visible {
            display: block;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>DeepSeek Chat API</h1>
                <p class="subtitle">Proof-of-Work enabled interface</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>
                <button class="icon-btn config-toggle" id="configToggle" title="Toggle configuration">
                    <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="card config-card" id="configCard">
            <div class="card-title">Configuration</div>
            
            <div class="input-group">
                <label for="apiUrl">API Endpoint</label>
                <select id="apiUrl">
                    <option value="http://localhost:3000">Custom URL (for CORS proxy)</option>
                    <option value="https://chat.deepseek.com/api/v0/chat/completion">Default Chat API</option>
                </select>
                <div class="url-display" id="currentUrl">http://localhost:3000</div>
                
                <div class="input-group" id="customUrlGroup" style="display: none; margin-top: 12px;">
                    <label for="customUrl">Custom Endpoint URL</label>
                    <input type="text" id="customUrl" placeholder="http://localhost:3000" value="http://localhost:3000" />
                </div>
                
                <p class="info-text">
                    Uses internal API with Proof-of-Work challenge.
                </p>
            </div>
        </div>

        <!-- NEW LAYOUT: Chat History on TOP -->
        <div class="card chat-card">
            <div class="chat-header">
                <div class="card-title" style="margin-bottom:0">Chat History</div>
                <button class="btn-secondary" id="clearBtn" style="padding: 6px 12px; font-size: 13px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Clear History
                </button>
            </div>
            <div class="chat-history" id="chatHistory">
                <!-- Messages will be injected here -->
                <div class="empty-state">
                    <p>Start a new conversation</p>
                    <p class="info-text">Messages are saved automatically.</p>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; border-top: none;">
             <div class="input-group">
                <textarea id="message" placeholder="Type your message here... (Ctrl+Enter to send)"></textarea>
            </div>
            
            <div class="pow-status" id="powStatus">
                <div id="powMessage">Ready to solve Proof-of-Work...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="powProgress"></div>
                </div>
            </div>
            
            <div class="debug-toggle">
                <button id="debugToggle">Show Debug Info</button>
            </div>
            
            <div class="debug-info" id="debugInfo">
                Debug information will appear here...
            </div>
            
            <div class="controls">
                <div></div> <!-- Spacer -->
                <button class="btn-primary" id="sendBtn">
                    Send Request
                </button>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <!-- Web Worker code will be created from Blob -->

    <script>
        class DeepSeekHash {
            constructor() {
                this.instance = null;
                this.memory = null;
                this.exports = null;
                this.isReady = false;
            }

            async init(wasmPath) {
                try {
                    updatePowStatus('Loading WASM module...', 'info', 0);
                    
                    const response = await fetch(wasmPath);
                    const bytes = await response.arrayBuffer();
                    
                    // Simple import object - the WASM seems self-contained
                    const importObject = {
                        env: {
                            memory: new WebAssembly.Memory({ initial: 256 }),
                        }
                    };

                    const { instance } = await WebAssembly.instantiate(bytes, importObject);
                    
                    this.instance = instance;
                    this.exports = instance.exports;
                    this.memory = this.exports.memory;
                    this.isReady = true;
                    
                    console.log('WASM loaded successfully');
                    console.log('Exports:', Object.keys(this.exports));
                    
                    updatePowStatus('WASM module ready', 'success', 100);
                    return this;
                    
                } catch (error) {
                    console.error('Failed to load WASM:', error);
                    updatePowStatus(`WASM load failed: ${error.message}`, 'error', 0);
                    throw error;
                }
            }

            // Write string to WASM memory and return pointer and length
            _writeToMemory(text) {
                if (!this.isReady) throw new Error('WASM not initialized');
                
                const encoder = new TextEncoder();
                const encoded = encoder.encode(text);
                const length = encoded.length;
                
                // Use __wbindgen_export_0 for allocation (like in Python)
                const ptr = this.exports.__wbindgen_export_0(length, 1);
                
                // Get memory view and write the string
                const memoryView = new Uint8Array(this.memory.buffer);
                memoryView.set(encoded, ptr);
                
                return [ptr, length];
            }

            // Calculate hash using the same method as Python
            calculateHash(algorithm, challenge, salt, difficulty, expireAt) {
                if (!this.isReady) throw new Error('WASM not initialized');
                
                console.log('Calculating hash with params:');
                console.log('Algorithm:', algorithm);
                console.log('Challenge:', challenge);
                console.log('Salt:', salt);
                console.log('Difficulty:', difficulty);
                console.log('ExpireAt:', expireAt);
                
                // Build prefix string exactly as in Python: f"{salt}_{expire_at}_"
                const prefix = `${salt}_${expireAt}_`;
                
                // Allocate space for return value (16 bytes)
                const retptr = this.exports.__wbindgen_add_to_stack_pointer(-16);
                
                try {
                    // Write challenge and prefix to memory
                    const [challengePtr, challengeLen] = this._writeToMemory(challenge);
                    const [prefixPtr, prefixLen] = this._writeToMemory(prefix);
                    
                    console.log('Calling wasm_solve with:');
                    console.log('  retptr:', retptr);
                    console.log('  challengePtr:', challengePtr);
                    console.log('  challengeLen:', challengeLen);
                    console.log('  prefixPtr:', prefixPtr);
                    console.log('  prefixLen:', prefixLen);
                    console.log('  difficulty:', difficulty);
                    
                    // Call wasm_solve exactly as in Python
                    this.exports.wasm_solve(
                        retptr,
                        challengePtr,
                        challengeLen,
                        prefixPtr,
                        prefixLen,
                        parseFloat(difficulty)
                    );
                    
                    // Read result from memory
                    const memoryView = new Uint8Array(this.memory.buffer);
                    
                    // Read status (4 bytes, little endian)
                    const statusBytes = memoryView.slice(retptr, retptr + 4);
                    const status = new Int32Array(statusBytes.buffer)[0];
                    
                    console.log('Status:', status);
                    
                    if (status === 0) {
                        return null;
                    }
                    
                    // Read answer (8 bytes, float64, little endian)
                    const answerBytes = memoryView.slice(retptr + 8, retptr + 16);
                    const answerValue = new Float64Array(answerBytes.buffer)[0];
                    const answer = Math.floor(answerValue);
                    
                    console.log('Answer value:', answerValue);
                    console.log('Answer (int):', answer);
                    
                    return answer;
                    
                } finally {
                    // Clean up stack pointer
                    this.exports.__wbindgen_add_to_stack_pointer(16);
                }
            }
        }

        class DeepSeekPOW {
            constructor() {
                this.hasher = new DeepSeekHash();
            }

            async initialize(wasmPath) {
                try {
                    await this.hasher.init(wasmPath);
                    console.log('DeepSeekPOW initialized');
                    return true;
                } catch (error) {
                    console.error('Failed to initialize DeepSeekPOW:', error);
                    return false;
                }
            }

        // ==============================
        // STREAM RESPONSE PARSER
        // ==============================

        async function parseStreamResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let responseMessageId = null;
            let buffer = '';
            
            // State for DeepSeek Diff Parser
            const messageState = {
                fragments: [], // Array to hold content fragments in order
                fragmentMap: {} // Map id to index for robust updates
            };
            
            // Create a placeholder message if needed
            if (messages.length === 0 || messages[messages.length-1].role !== 'assistant') {
                appendMessage('assistant', '...'); // Initial placeholder
            }
            
            // Helper to update the state from a Diff
            function processDeepSeekDiff(diff, state, parentPath = '') {
                try {
                    if (!diff) return;
                    
                    // Calculate current path including parent context
                    let currentPath = parentPath;
                    if (diff.p) {
                        if (currentPath && !currentPath.endsWith('/')) currentPath += '/';
                        currentPath += diff.p;
                    }

                    // Handle BATCH (array of diffs in v)
                    if (diff.o === 'BATCH' || (diff.o === undefined && Array.isArray(diff.v) && diff.p === undefined)) {
                        if (Array.isArray(diff.v)) {
                            // Pass currentPath as parentPath to children
                            diff.v.forEach(item => processDeepSeekDiff(item, state, currentPath));
                        }
                        return;
                    }
                    
                    // Path handling (Normalize)
                    let path = currentPath;
                    if (path.startsWith('response/')) path = path.replace('response/', '');
                    if (path === 'response') path = '';
                    if (path.startsWith('/')) path = path.substring(1);
                    
                    // 1. Fragments Append (New Fragment)
                    // Relaxed check: match 'fragments' or '.../fragments'
                    if ((path === 'fragments' || path.endsWith('/fragments')) && diff.o === 'APPEND') {
                        const items = Array.isArray(diff.v) ? diff.v : [diff.v];
                        items.forEach(item => {
                            const newFragment = {
                                type: item.type || 'TEXT', // THINK or TEXT/RESPONSE
                                content: item.content || '',
                                id: item.id
                            };
                            state.fragments.push(newFragment);
                            // Map the fragment ID (if present) to its index
                            if (item.id !== undefined) {
                                state.fragmentMap[item.id] = state.fragments.length - 1;
                            }
                            addDebugLog('Fragment created', newFragment);
                        });
                        return;
                    }
                    
                    // 2. Fragment Content Update via Index
                    // Path format: fragments/0/content
                    const contentMatch = path.match(/fragments\/(\d+)\/content$/);
                    if (contentMatch) {
                        const index = parseInt(contentMatch[1]);
                        
                        // Auto-create fragment if missing (Self-Healing)
                        if (!state.fragments[index]) {
                            if (index === state.fragments.length) {
                                // Assume it's a generic text fragment if not specified
                                const newFragment = { type: 'TEXT', content: '', id: null };
                                state.fragments.push(newFragment);
                                addDebugLog(`Auto-created missing fragment ${index}`, newFragment);
                            } else {
                                // Try to recover by creating intermediate fragments?
                                // For now, just log warning and create it anyway to avoid stalling
                                const newFragment = { type: 'TEXT', content: '', id: null };
                                // Fill gaps
                                while(state.fragments.length < index) {
                                     state.fragments.push({ type: 'TEXT', content: '(missing)', id: null });
                                }
                                state.fragments.push(newFragment);
                                addDebugLog(`Force-created missing fragment ${index}`);
                            }
                        }

                        if (state.fragments[index]) {
                            state.fragments[index].content += diff.v;
                        }
                        return;
                    }

                    // 3. Fragment Type Update
                    const typeMatch = path.match(/fragments\/(\d+)\/type$/);
                    if (typeMatch) {
                        const index = parseInt(typeMatch[1]);
                        if (state.fragments[index]) {
                            state.fragments[index].type = diff.v;
                        }
                        return;
                    }
                    
                    // 3b. Missing 'content' or 'response/content' handler?
                    // Let's add it in case the backend sends mixed formats.
                    // This matches "content" or "response/content" (normalized to "content")
                    if (path === 'content' && typeof diff.v === 'string') {
                        // Find the last TEXT fragment or create one
                        let lastFragment = state.fragments[state.fragments.length - 1];
                        if (!lastFragment || lastFragment.type !== 'TEXT') {
                            lastFragment = { type: 'TEXT', content: '', id: 'main' };
                            state.fragments.push(lastFragment);
                            addDebugLog('Created main TEXT fragment');
                        }
                        lastFragment.content += diff.v;
                        return;
                    }

                    // 4. Main Content Update (Non-fragment)
                    // Matches "content" or "response/content" (normalized to "content")
                    if (path === 'content' && typeof diff.v === 'string') {
                        // Find the last TEXT fragment or create one
                        let lastFragment = state.fragments[state.fragments.length - 1];
                        if (!lastFragment || lastFragment.type !== 'TEXT') {
                            lastFragment = { type: 'TEXT', content: '', id: 'main' };
                            state.fragments.push(lastFragment);
                            addDebugLog('Created main TEXT fragment');
                        }
                        lastFragment.content += diff.v;
                        return;
                    }
                    
                    // 5. Fallback: Recursively search for 'content' in diff.v if it's an object/array
                    if (typeof diff.v === 'object' && diff.v !== null) {
                        if (Array.isArray(diff.v)) {
                            diff.v.forEach(item => processDeepSeekDiff(item, state, currentPath));
                        } else {
                            processDeepSeekDiff(diff.v, state, currentPath);
                        }
                    } else {
                        // Log unhandled diffs that might contain text
                        if (typeof diff.v === 'string' && diff.v.length > 0) {
                            addDebugLog(`Unhandled diff path: ${path}`, diff.v);
                        }
                    }
                } catch (e) {
                    console.error('Error in processDeepSeekDiff:', e, diff);
                    addDebugLog('Error in processDeepSeekDiff', e.message);
                }
            }
            
            // Helper to render current state to HTML
            function renderStateToHtml(state) {
                if (state.fragments.length === 0) return '';
                
                return state.fragments.map(f => {
                    const safeContent = escapeHtml(f.content);
                    if (f.type === 'THINK') {
                        // Thinking block
                        return `<div class="thinking-block"><details open><summary>Thinking Process</summary><div class="thinking-content">${safeContent}</div></details></div>`;
                    } else if (f.type === 'RESPONSE' || f.type === 'TEXT') {
                        // Main response
                        return safeContent;
                    } else {
                        // Fallback
                        return safeContent;
                    }
                }).join('');
            }

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    buffer += chunk;
                    
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    
                    for (const line of lines) {
                        if (line.trim() === '') continue;
                        if (line.startsWith('data: ')) {
                            const dataStr = line.substring(6);
                            if (dataStr === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(dataStr);

                                // Special handling for "v" as a direct property (top-level diff)
                                // The log shows: data: {"v": "mm", "p": "response/fragments/0/content", "o": "APPEND"}
                                // AND data: {"v": "..."} which are continuations
                                
                                if (parsed.response_message_id) {
                                    responseMessageId = parsed.response_message_id;
                                    continue;
                                }

                                // Handle Standard OpenAI Format (fallback)
                                const choices = parsed.choices || parsed.data?.biz_data?.choices;
                                if (choices && choices[0]?.message?.content) {
                                    // Treat as a generic TEXT fragment
                                    if (messageState.fragments.length === 0) {
                                        messageState.fragments.push({ type: 'TEXT', content: '', id: null });
                                    }
                                    const content = choices[0].message.content;
                                    messageState.fragments[messageState.fragments.length-1].content += content;
                                    
                                    const html = renderStateToHtml(messageState);
                                    updateLastAssistantMessage(html, null, true, true);
                                    updateStreamingDOM(html, null);
                                    continue;
                                }

                                // Handle DeepSeek JSON-Diff
                                try {
                                    // If the object has 'v' but no 'p' and no 'choices', it might be a direct content append
                                    // to the last active fragment (implicit context).
                                    // See log line 15: data: {"v": ","} -> No path!
                                    
                                    if (parsed.v !== undefined && parsed.p === undefined && parsed.o === undefined && !parsed.response) {
                                        // Implicit append to last fragment?
                                        // Or maybe it is a "TEXT" fragment if none exists?
                                        
                                        // But wait, line 13: {"v": "mm", "p": "response/fragments/0/content", "o": "APPEND"}
                                        // This sets context.
                                        
                                        // If we receive just {v: "text"}, where does it go?
                                        // Log line 13 sets p=".../content".
                                        // Log line 15 is just {v: ","}.
                                        // Hypothesis: It appends to the SAME path as the previous diff if 'p' is missing?
                                        // OR, it defaults to appending to the last modified fragment?
                                        
                                        // Let's try appending to the last fragment if it exists.
                                        const lastFrag = messageState.fragments[messageState.fragments.length - 1];
                                        if (lastFrag) {
                                            lastFrag.content += parsed.v;
                                            
                                            const html = renderStateToHtml(messageState);
                                            updateLastAssistantMessage(html, null, true, true);
                                            updateStreamingDOM(html, null);
                                            continue; // handled
                                        }
                                    }

                                    processDeepSeekDiff(parsed, messageState);
                                    
                                    const html = renderStateToHtml(messageState);
                                    const usage = parsed.usage || parsed.data?.biz_data?.usage;

                                    if (messageState.fragments.length > 0) {
                                        updateLastAssistantMessage(html, usage, true, true);
                                        updateStreamingDOM(html, usage);
                                    }
                                } catch (diffError) {
                                    console.error('Error processing diff:', diffError, parsed);
                                    addDebugLog('Error processing diff', diffError.message);
                                }

                            } catch (e) {
                                console.error('Error parsing JSON chunk', e, dataStr.substring(0, 100));
                            }
                        }
                    }
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Stream aborted');
                    appendMessage('system', 'Generation stopped by user.');
                } else {
                    console.error('Stream reading error:', error);
                }
            }
            
            saveMessages(); // Final save
            return { responseMessageId, fullResponse: renderStateToHtml(messageState) };
        }

        // Request PoW challenge
        async function requestPowChallenge() {
            updatePowStatus('Requesting PoW challenge...', 'info', 0);
            addDebugLog('Requesting PoW challenge');
            
            try {
                const response = await fetch(CHALLENGE_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-client-version': '1.5.0',
                        'x-app-version': '20241129.1',
                        'x-client-platform': 'web',
                        'x-client-locale': 'en_US',
                        'x-debug-model-channel': 'prod',
                        'x-debug-lite-model-channel': 'prod',
                        'Referer': 'https://chat.deepseek.com/',
                        'Origin': 'https://chat.deepseek.com'
                    },
                    body: JSON.stringify({
                        target_path: '/api/v0/chat/completion'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Challenge request failed: ${response.status}`);
                }

                const result = await response.json();
                addDebugLog('Received PoW challenge', result);
                
                const challengeData = result.data?.biz_data?.challenge;
                if (!challengeData) {
                    throw new Error('Invalid challenge response structure');
                }
                
                if (challengeData.expire_at < Date.now()) {
                    throw new Error('Challenge expired');
                }
                
                return challengeData;
            } catch (error) {
                updatePowStatus(`Error: ${error.message}`, 'error', 0);
                throw error;
            }
        }

        // Initialize the solver
        const powSolver = new DeepSeekPOW();

        // Update the solvePowWithWasm function
        async function solvePowWithWasm(challengeData) {
            try {
                updatePowStatus('Initializing PoW solver...', 'info', 0);
                
                // Ensure WASM is loaded
                if (!powSolver.hasher.isReady) {
                    const initialized = await powSolver.initialize('sha3_wasm_bg.7b9ca65ddd.wasm');
                    if (!initialized) {
                        throw new Error('Failed to initialize WASM solver');
                    }
                }
                
                updatePowStatus('Solving PoW challenge...', 'mining', 50);
                
                // Solve the challenge
                const result = await powSolver.solveChallenge(challengeData);
                
                updatePowStatus(
                    `Solved! Answer: ${result.answer}`,
                    'success',
                    100
                );
                
                addDebugLog('PoW solved', result);
                
                return {
                    powHeader: result.powHeader,
                    iterations: result.iterations,
                    time: result.time
                };
                
            } catch (error) {
                updatePowStatus(`PoW solving error: ${error.message}`, 'error', 0);
                console.error('PoW solving error details:', error);
                throw error;
            }
        }

        // Send chat completion request
        async function sendChatCompletion(message, powHeader) {
            updatePowStatus('Sending chat request...', 'info', 100);
            addDebugLog('Sending chat completion request');
            
            const requestPayload = {
                chat_session_id: currentConversation.sessionId,
                parent_message_id: getParentMessageId(),
                prompt: message,
                ref_file_ids: [],
                thinking_enabled: true,
                search_enabled: true,
                client_stream_id: generateClientStreamId()
            };
            
            addDebugLog('Request payload', requestPayload);
            
            // Create AbortController
            currentController = new AbortController();
            const signal = currentController.signal;
            
            const response = await fetch(COMPLETION_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-ds-pow-response': powHeader,
                    'x-client-version': '1.5.0',
                    'x-app-version': '20241129.1',
                    'x-client-platform': 'web',
                    'x-client-locale': 'en_US',
                    'x-debug-model-channel': 'prod',
                    'x-debug-lite-model-channel': 'prod',
                    'Referer': 'https://chat.deepseek.com/',
                    'Origin': 'https://chat.deepseek.com'
                },
                body: JSON.stringify(requestPayload),
                signal: signal
            });
            
            addDebugLog('Response status', response.status);
            
            if (!response.ok) {
                const errorText = await response.text();
                addDebugLog('Error response', errorText);
                throw new Error(`API error ${response.status}: ${errorText}`);
            }

            // Handle streaming response
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('text/event-stream')) {
                const { responseMessageId, fullResponse } = await parseStreamResponse(response);
                updateConversationWithResponse(responseMessageId);
                return fullResponse;
            } else {
                const data = await response.json();
                addDebugLog('Non streaming response:', data);
                return data;
            }
        }

        async function sendRequest() {
            // Check if we are currently generating (Stop button logic)
            if (currentController) {
                currentController.abort();
                currentController = null;
                sendBtn.innerHTML = 'Send Request';
                sendBtn.classList.remove('btn-stop');
                sendBtn.classList.add('btn-primary');
                showStatus('Request stopped', 'info');
                return;
            }
            
            const message = messageInput.value.trim();
            if (!message) {
                showStatus('Please enter a message', 'error');
                messageInput.focus();
                return;
            }

            // Prepare UI for Sending
            sendBtn.classList.remove('btn-primary');
            sendBtn.classList.add('btn-stop');
            sendBtn.innerHTML = '<div class="spinner"></div>'; // Compact spinner/stop
            // Ideally we want a square stop icon, but for now spinner is feedback.
            // Requirement: "Make the button square/icon-only to save space (remove "Send" text)."
            // And "Clicking Stop should abort".
            
            // Let's make it a Stop Square
            sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';
            sendBtn.title = "Stop Generating";

            try {
                // Add user message to history
                appendMessage('user', message);
                messageInput.value = ''; // Clear input

                // Initialize conversation if needed
                if (!currentConversation.sessionId) {
                    await startNewConversation();
                    showStatus('New chat session started', 'info');
                }

                // Step 1: Request PoW challenge
                const challengeData = await requestPowChallenge();
                
                // Step 2: Solve PoW with WASM
                const { powHeader, iterations, time } = await solvePowWithWasm(challengeData);
                
                // Step 3: Send chat completion
                const result = await sendChatCompletion(message, powHeader);
                
                // Step 4: Display result
                if (typeof result === 'string') {
                    // Already displayed by parseStreamResponse
                    showStatus(`Success! PoW solved`, 'success');
                } else if (result.choices && result.choices.length > 0) {
                    const reply = result.choices[0].message.content;
                    updateLastAssistantMessage(reply, result.usage, false); // Assuming plain text fallback
                    
                    showStatus(`Success!`, 'success');
                } else if (result.message || result.content) {
                    appendMessage('assistant', result.message || result.content);
                    showStatus('Success!', 'success');
                } else {
                    appendMessage('assistant', JSON.stringify(result, null, 2));
                    showStatus('Success!', 'success');
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    // Handled in parseStreamResponse usually, but if it happens before stream
                    showStatus('Request stopped', 'info');
                } else {
                    console.error('Request failed:', error);
                    appendMessage('assistant', `Error: ${error.message}`);
                    showStatus(`Error: ${error.message}`, 'error');
                }
            } finally {
                // Reset UI
                sendBtn.classList.remove('btn-stop');
                sendBtn.classList.add('btn-primary');
                sendBtn.innerHTML = 'Send Request';
                sendBtn.title = "Send Request";
                currentController = null;
            }
        }

        // ==============================
        // UI EVENT HANDLERS
        // ==============================

        // Initialize config state
        function initializeConfigState() {
            if (!configExpanded) {
                configCard.classList.add('collapsed');
                configToggle.classList.remove('active');
            } else {
                configCard.classList.remove('collapsed');
                configToggle.classList.add('active');
            }
        }

        // Toggle configuration visibility
        configToggle.addEventListener('click', () => {
            configExpanded = !configExpanded;
            
            if (configExpanded) {
                configCard.classList.remove('collapsed');
                configToggle.classList.add('active');
                showStatus('Configuration expanded', 'info');
            } else {
                configCard.classList.add('collapsed');
                configToggle.classList.remove('active');
                showStatus('Configuration collapsed', 'info');
            }
            
            localStorage.setItem('configExpanded', configExpanded);
        });

        // Handle API URL selection
        apiUrlSelect.addEventListener('change', function() {
            if (this.value === '') {
                customUrlGroup.style.display = 'block';
                currentUrlDisplay.textContent = 'Waiting for custom URL...';
            } else {
                customUrlGroup.style.display = 'none';
                currentUrlDisplay.textContent = this.value;
            }
        });

        // Update URL display
        customUrlInput.addEventListener('input', function() {
            if (this.value.trim()) {
                currentUrlDisplay.textContent = this.value;
            } else {
                currentUrlDisplay.textContent = 'Waiting for custom URL...';
            }
        });

        // Get endpoint URL
        function getEndpointUrl() {
            if (apiUrlSelect.value === '' && customUrlInput.value.trim()) {
                return customUrlInput.value.trim();
            }
            return apiUrlSelect.value || COMPLETION_ENDPOINT;
        }

        // Clear chat history
        async function clearChat() {
            if (confirm('Are you sure you want to clear the chat history?')) {
                messages = [];
                saveMessages();
                renderMessages();
                
                // Reset conversation
                await startNewConversation();
                
                showStatus('Chat history cleared', 'info');
            }
        }

        // Toggle debug info
        debugToggle.addEventListener('click', () => {
            debugEnabled = !debugEnabled;
            debugToggle.textContent = debugEnabled ? 'Hide Debug Info' : 'Show Debug Info';
            debugInfo.classList.toggle('visible', debugEnabled);
        });

        // Event listeners
        sendBtn.addEventListener('click', sendRequest);
        clearBtn.addEventListener('click', clearChat);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendRequest();
            }
            if (e.key === 'Escape') {
                // Optional: stop generating?
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                configToggle.click();
                e.preventDefault();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                debugToggle.click();
                e.preventDefault();
            }
        });

        // Example messages on double-click
        messageInput.addEventListener('dblclick', () => {
            const examples = [
                "Explain quantum computing in simple terms",
                "Write a Python function to calculate Fibonacci numbers",
                "What are the benefits of renewable energy?",
                "How does machine learning work?",
                "Create a short poem about technology"
            ];
            messageInput.value = examples[Math.floor(Math.random() * examples.length)];
            showStatus('Example loaded', 'info');
        });

        // ==============================
        // INITIALIZATION
        // ==============================

        // Update the initialization to handle WASM loading better
        window.addEventListener('DOMContentLoaded', () => {
            // Load token from URL hash if present
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            // Pre-fill with proxy URL
            customUrlInput.value = 'http://localhost:3000';
            
            // Update URL display
            currentUrlDisplay.textContent = getEndpointUrl();
            
            // Initialize config state
            initializeConfigState();
            
            // Render chat history
            renderMessages();
            
            // Pre-load WASM module
            setTimeout(() => {
                console.log('Pre-loading WASM module...');
                powSolver.initialize('sha3_wasm_bg.7b9ca65ddd.wasm')
                    .then(initialized => {
                        if (initialized) {
                            showStatus('WASM PoW solver ready', 'success');
                        } else {
                            showStatus('WASM solver failed to load', 'warning');
                        }
                    })
                    .catch(error => {
                        console.error('WASM pre-load error:', error);
                        showStatus(`WASM error: ${error.message}`, 'error');
                    });
            }, 500);
            
            // Show welcome message
            showStatus('Ready. Enter message to begin.', 'info');
        });
    </script>
</body>
