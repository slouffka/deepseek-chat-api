<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat API</title>
    <style>
        :root {
            --primary: #007AFF;
            --surface: #FFFFFF;
            --border: #E5E5EA;
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --text-tertiary: #C7C7CC;
            --success: #34C759;
            --warning: #FF9500;
            --error: #FF3B30;
            --radius: 8px;
            --spacing: 16px;
            --spacing-sm: 8px;
            --spacing-lg: 24px;
            --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-ui);
            color: var(--text-primary);
            line-height: 1.4;
            background: #F2F2F7;
            padding: var(--spacing);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 640px;
            margin: 0 auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: var(--spacing);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing);
        }

        .header-left {
            flex: 1;
        }

        h1 {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .config-toggle {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .config-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        .config-toggle.active {
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: var(--spacing);
            border: 1px solid var(--border);
        }

        .config-card {
            overflow: hidden;
            transition: all 0.3s ease;
            max-height: 500px;
            opacity: 1;
        }

        .config-card.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border: 1px solid transparent;
            opacity: 0;
            margin-bottom: 0;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .input-group {
            margin-bottom: var(--spacing);
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 15px;
            background: var(--surface);
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: none;
            min-height: 120px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
        }

        .url-display {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: #F8F8F8;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 6px;
            word-break: break-all;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
            margin-top: var(--spacing);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #0056CC;
        }

        .btn-primary:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #F2F2F7;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #E5E5EA;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #E68A00;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .response-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        #response {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--spacing);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-y: auto;
            min-height: 150px;
            color: var(--text-primary);
        }

        .response-placeholder {
            color: var(--text-tertiary);
            font-style: italic;
        }

        .status-bar {
            position: fixed;
            bottom: var(--spacing);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            display: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }

        .status-bar.visible {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .info-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        .token-security {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 6px;
            padding: 8px;
            background: #FFF3E0;
            border-radius: 6px;
            font-size: 11px;
            color: #E65100;
        }

        .gear-icon {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .config-toggle.active .gear-icon {
            transform: rotate(90deg);
        }

        .payload-info {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: #F8F8F8;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .pow-status {
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            background: #F0F7FF;
            border-left: 3px solid var(--primary);
            display: none;
        }

        .pow-status.active {
            display: block;
        }

        .pow-status.mining {
            background: #FFF7E6;
            border-left-color: var(--warning);
        }

        .pow-status.success {
            background: #F0FFF4;
            border-left-color: var(--success);
        }

        .pow-status.error {
            background: #FFF0F0;
            border-left-color: var(--error);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-fill.mining {
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .debug-toggle {
            text-align: right;
            margin-top: 8px;
        }

        .debug-toggle button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 4px 8px;
        }

        .debug-toggle button:hover {
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }

        .debug-info {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            background: #F8F8F8;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-info.visible {
            display: block;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>DeepSeek Chat API</h1>
                <p class="subtitle">Proof-of-Work enabled interface</p>
            </div>
            <button class="config-toggle" id="configToggle" title="Toggle configuration">
                <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" />
                    <path d="M19.4 15C19.5 15.4 19.6 15.8 19.7 16.2L21.5 17.5C21.8 17.7 22 18.1 21.9 18.5L20.9 21.2C20.8 21.6 20.4 21.9 20 21.9L17.7 21.4C17.2 21.7 16.7 21.9 16.2 22.1L15.8 24.4C15.7 24.8 15.4 25.1 15 25.1H12C11.6 25.1 11.3 24.8 11.2 24.4L10.8 22.1C10.3 21.9 9.8 21.7 9.3 21.4L7 21.9C6.6 21.9 6.2 21.6 6.1 21.2L5.1 18.5C5 18.1 5.2 17.7 5.5 17.5L7.3 16.2C7.4 15.8 7.5 15.4 7.6 15L5.8 13.7C5.5 13.5 5.3 13.1 5.4 12.7L6.4 10C6.5 9.6 6.9 9.3 7.3 9.3L9.6 9.8C10.1 9.5 10.6 9.3 11.1 9.1L11.5 6.8C11.6 6.4 11.9 6.1 12.3 6.1H15.3C15.7 6.1 16 6.4 16.1 6.8L16.5 9.1C17 9.3 17.5 9.5 18 9.8L20.3 9.3C20.7 9.3 21.1 9.6 21.2 10L22.2 12.7C22.3 13.1 22.1 13.5 21.8 13.7L20 15Z" />
                </svg>
            </button>
        </header>

        <div class="card config-card" id="configCard">
            <div class="card-title">Configuration</div>
            
            <div class="input-group">
                <label for="apiUrl">API Endpoint</label>
                <select id="apiUrl">
                    <option value="http://localhost:3000">Custom URL (for CORS proxy)</option>
                    <option value="https://chat.deepseek.com/api/v0/chat/completion">Default Chat API</option>
                </select>
                <div class="url-display" id="currentUrl">http://localhost:3000</div>
                
                <div class="input-group" id="customUrlGroup" style="display: none; margin-top: 12px;">
                    <label for="customUrl">Custom Endpoint URL</label>
                    <input type="text" id="customUrl" placeholder="http://localhost:3000" value="http://localhost:3000" />
                </div>
                
                <p class="info-text">
                    Uses internal API with Proof-of-Work challenge.
                </p>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Request</div>
            <div class="input-group">
                <label for="message">Prompt (User Message)</label>
                <textarea id="message" placeholder="Enter your message...">Explain quantum computing in simple terms</textarea>
            </div>
            
            <div class="pow-status" id="powStatus">
                <div id="powMessage">Ready to solve Proof-of-Work...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="powProgress"></div>
                </div>
            </div>
            
            <div class="debug-toggle">
                <button id="debugToggle">Show Debug Info</button>
            </div>
            
            <div class="debug-info" id="debugInfo">
                Debug information will appear here...
            </div>
            
            <div class="controls">
                <button class="btn-secondary" id="clearBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    New Chat
                </button>
                <button class="btn-primary" id="sendBtn">
                    Send Request
                </button>
            </div>
        </div>

        <div class="card response-container">
            <div class="card-title">Response</div>
            <div id="response" class="response-placeholder">Response will appear here...</div>
        </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <!-- Web Worker code will be created from Blob -->

    <script>
        // ==============================
        // WASM-BASED PoW SOLVER
        // ==============================

        class WASMPoWSolver {
            constructor() {
                this.wasmInstance = null;
                this.memory = null;
                this.exports = null;
                this.isReady = false;
                this.initialized = false;
            }

            async loadWasm(wasmUrl) {
                try {
                    updatePowStatus('Loading WASM module...', 'info', 0);
                    
                    const response = await fetch(wasmUrl);
                    const bytes = await response.arrayBuffer();
                    
                    // Minimal import object
                    const importObject = {
                        env: {
                            memory: new WebAssembly.Memory({ initial: 256 }),
                        },
                        // Add some stubs for common functions
                        imports: {
                            log: console.log,
                            error: console.error
                        }
                    };

                    const { instance } = await WebAssembly.instantiate(bytes, importObject);
                    
                    this.wasmInstance = instance;
                    this.exports = instance.exports;
                    this.memory = this.exports.memory;
                    this.isReady = true;
                    
                    console.log('WASM loaded successfully');
                    console.log('Available exports:', Object.keys(this.exports));
                    
                    // Test the functions
                    await this.testWasmFunctions();
                    
                    updatePowStatus('WASM module ready', 'success', 100);
                    return true;
                    
                } catch (error) {
                    console.error('Failed to load WASM:', error);
                    updatePowStatus(`WASM load failed: ${error.message}`, 'error', 0);
                    return false;
                }
            }

            async testWasmFunctions() {
                try {
                    console.log('Testing WASM functions...');
                    
                    // Test wasm_deepseek_hash_v1 with simple input
                    const testInput = new TextEncoder().encode('test');
                    const testOffset = 1024;
                    
                    // Get fresh memory view
                    const memoryView = new Uint8Array(this.memory.buffer);
                    
                    // Ensure memory is large enough
                    if (testOffset + testInput.length > memoryView.length) {
                        console.warn('Memory too small, attempting to grow...');
                        this.memory.grow(1); // Grow by 1 page (64KB)
                    }
                    
                    // Write test data
                    const freshMemoryView = new Uint8Array(this.memory.buffer);
                    freshMemoryView.set(testInput, testOffset);
                    
                    // Call hash function
                    const hashPtr = this.exports.wasm_deepseek_hash_v1(testOffset, testInput.length);
                    console.log('Hash function test - returned pointer:', hashPtr);
                    
                    if (hashPtr && hashPtr !== 0) {
                        const hashBytes = new Uint8Array(this.memory.buffer, hashPtr, 32);
                        const hashHex = Array.from(hashBytes).map(b => b.toString(16).padStart(2, '0')).join('');
                        console.log('Test hash result:', hashHex);
                    }
                    
                    this.initialized = true;
                    
                } catch (error) {
                    console.error('WASM function test failed:', error);
                }
            }

            // Helper: hex string to bytes
            hexToBytes(hex) {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < hex.length; i += 2) {
                    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
                }
                return bytes;
            }

            // Helper: bytes to hex string
            bytesToHex(bytes) {
                return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // Calculate target from difficulty
            calculateTargetFromDifficulty(difficulty) {
                const maxHash = (1n << 256n) - 1n;
                const targetBigInt = maxHash / BigInt(difficulty);
                let targetHex = targetBigInt.toString(16);
                targetHex = targetHex.padStart(64, '0');
                return targetHex;
            }

            // Simpler approach: Use the algorithm from Python code but in JS
            // Let's implement the same logic as in the Python pow.py
            async solve(challenge, salt, difficulty, signature) {
                if (!this.isReady) {
                    throw new Error('WASM module not loaded');
                }

                console.log('Starting PoW solve...');
                console.log('Challenge:', challenge);
                console.log('Salt:', salt);
                console.log('Difficulty:', difficulty);
                
                const targetHex = this.calculateTargetFromDifficulty(difficulty);
                const targetBigInt = BigInt('0x' + targetHex);
                
                // Convert inputs to bytes
                const challengeBytes = this.hexToBytes(challenge);
                const saltBytes = this.hexToBytes(salt);
                
                // Combine challenge + salt as prefix
                const prefixBytes = new Uint8Array(challengeBytes.length + saltBytes.length);
                prefixBytes.set(challengeBytes);
                prefixBytes.set(saltBytes, challengeBytes.length);
                
                let nonce = 0n;
                const maxNonce = 1000000n; // Limit for browser safety
                const startTime = Date.now();
                let hashesComputed = 0;
                
                // We'll use a simpler approach: try calling wasm_solve with the correct parameters
                // First, let's see if we can get wasm_solve to work by examining what it expects
                
                // Based on the Python code, wasm_solve likely expects:
                // 1. Pointer to prefix bytes (challenge + salt)
                // 2. Prefix length
                // 3. Pointer to target bytes (hex string)
                // 4. Target length
                
                try {
                    // Convert prefix to base64 like the Python code does
                    const prefixBase64 = btoa(String.fromCharCode(...prefixBytes));
                    const targetHexStr = targetHex;
                    
                    console.log('Prefix (base64):', prefixBase64);
                    console.log('Target (hex):', targetHexStr);
                    
                    // Encode strings
                    const encoder = new TextEncoder();
                    const prefixEncoded = encoder.encode(prefixBase64);
                    const targetEncoded = encoder.encode(targetHexStr);
                    
                    // Allocate space in memory - use fixed offsets
                    const memory = this.memory;
                    const pageSize = 64 * 1024; // 64KB
                    
                    // Grow memory if needed
                    const neededBytes = 4096 + prefixEncoded.length + targetEncoded.length;
                    const currentPages = memory.buffer.byteLength / pageSize;
                    const neededPages = Math.ceil(neededBytes / pageSize);
                    
                    if (neededPages > currentPages) {
                        memory.grow(neededPages - currentPages);
                    }
                    
                    // Use fresh memory view
                    const memoryView = new Uint8Array(memory.buffer);
                    
                    // Write data to memory at fixed offsets
                    const prefixOffset = 1024;
                    const targetOffset = prefixOffset + prefixEncoded.length + 1024;
                    
                    memoryView.set(prefixEncoded, prefixOffset);
                    memoryView.set(targetEncoded, targetOffset);
                    
                    // Try calling wasm_solve with different parameter combinations
                    let noncePtr;
                    
                    // Try: wasm_solve(prefix_ptr, prefix_len, target_ptr, target_len)
                    try {
                        noncePtr = this.exports.wasm_solve(prefixOffset, prefixEncoded.length, targetOffset, targetEncoded.length);
                        console.log('wasm_solve returned pointer:', noncePtr);
                    } catch (error) {
                        console.log('First signature failed, trying different one...');
                        // Try: wasm_solve(prefix_ptr, target_ptr) - without lengths
                        noncePtr = this.exports.wasm_solve(prefixOffset, targetOffset);
                        console.log('wasm_solve (2 params) returned pointer:', noncePtr);
                    }
                    
                    if (noncePtr && noncePtr !== 0) {
                        // Read 8-byte nonce from the pointer
                        const nonceBytes = new Uint8Array(memory.buffer, noncePtr, 8);
                        const nonceView = new DataView(nonceBytes.buffer, nonceBytes.byteOffset, 8);
                        const nonce = nonceView.getBigUint64(0, true); // Little endian
                        
                        console.log('Found nonce via wasm_solve:', Number(nonce));
                        
                        // Calculate signature
                        const sigInput = signature + nonce.toString(16).padStart(16, '0');
                        const sigInputBytes = encoder.encode(sigInput);
                        const sigInputOffset = targetOffset + targetEncoded.length + 1024;
                        
                        memoryView.set(sigInputBytes, sigInputOffset);
                        const finalSigPtr = this.exports.wasm_deepseek_hash_v1(sigInputOffset, sigInputBytes.length);
                        const finalSigBytes = new Uint8Array(memory.buffer, finalSigPtr, 32);
                        const finalSigHex = this.bytesToHex(finalSigBytes);
                        
                        return {
                            answer: Number(nonce),
                            signature: finalSigHex,
                            time: Date.now() - startTime,
                            iterations: 1,
                            hashRate: 0
                        };
                    } else {
                        console.log('wasm_solve returned null/zero, falling back to manual solve...');
                    }
                    
                } catch (error) {
                    console.log('wasm_solve approach failed, falling back:', error);
                }
                
                // Fallback: Manual solving using wasm_deepseek_hash_v1
                console.log('Starting manual solving...');
                
                return await this.solveManually(challenge, salt, difficulty, signature);
            }

            // Manual solving using wasm_deepseek_hash_v1
            async solveManually(challenge, salt, difficulty, signature) {
                const targetHex = this.calculateTargetFromDifficulty(difficulty);
                const targetBigInt = BigInt('0x' + targetHex);
                
                // Convert inputs to bytes
                const challengeBytes = this.hexToBytes(challenge);
                const saltBytes = this.hexToBytes(salt);
                
                // Combine challenge + salt
                const prefixBytes = new Uint8Array(challengeBytes.length + saltBytes.length);
                prefixBytes.set(challengeBytes);
                prefixBytes.set(saltBytes, challengeBytes.length);
                
                let nonce = 0n;
                const maxNonce = 100000n; // Reduced for browser
                const startTime = Date.now();
                let hashesComputed = 0;
                let lastReportTime = startTime;
                
                const memory = this.memory;
                const encoder = new TextEncoder();
                
                while (nonce < maxNonce) {
                    // IMPORTANT: Get fresh memory view every iteration to avoid detached buffer
                    const memoryView = new Uint8Array(memory.buffer);
                    
                    // Convert nonce to 8-byte little-endian
                    const nonceBytes = new Uint8Array(8);
                    const nonceView = new DataView(nonceBytes.buffer);
                    nonceView.setBigUint64(0, nonce, true);
                    
                    // Combine prefix + nonce
                    const data = new Uint8Array(prefixBytes.length + nonceBytes.length);
                    data.set(prefixBytes);
                    data.set(nonceBytes, prefixBytes.length);
                    
                    // Write to memory at a fixed offset
                    const dataOffset = 2048;
                    
                    // Ensure we have enough memory
                    if (dataOffset + data.length > memoryView.length) {
                        // Calculate needed pages
                        const pageSize = 64 * 1024;
                        const neededBytes = dataOffset + data.length;
                        const currentPages = memory.buffer.byteLength / pageSize;
                        const neededPages = Math.ceil(neededBytes / pageSize);
                        
                        if (neededPages > currentPages) {
                            memory.grow(neededPages - currentPages);
                            // After growing, get fresh view
                            continue; // Retry this iteration with fresh memory
                        }
                    }
                    
                    // Write data to memory
                    memoryView.set(data, dataOffset);
                    
                    // Call hash function
                    const hashPtr = this.exports.wasm_deepseek_hash_v1(dataOffset, data.length);
                    
                    // Read hash using fresh view
                    const freshMemoryView = new Uint8Array(memory.buffer);
                    const hashBytes = freshMemoryView.slice(hashPtr, hashPtr + 32);
                    const hashHex = this.bytesToHex(hashBytes);
                    const hashBigInt = BigInt('0x' + hashHex);
                    
                    hashesComputed++;
                    
                    // Check if solution found
                    if (hashBigInt < targetBigInt) {
                        const elapsed = Date.now() - startTime;
                        console.log(`Manual solution found! Nonce: ${nonce}`);
                        
                        // Calculate final signature
                        const sigInput = signature + nonce.toString(16).padStart(16, '0');
                        const sigInputBytes = encoder.encode(sigInput);
                        const sigInputOffset = dataOffset + data.length + 1024;
                        
                        // Write signature input
                        freshMemoryView.set(sigInputBytes, sigInputOffset);
                        const finalSigPtr = this.exports.wasm_deepseek_hash_v1(sigInputOffset, sigInputBytes.length);
                        const finalSigBytes = freshMemoryView.slice(finalSigPtr, finalSigPtr + 32);
                        const finalSigHex = this.bytesToHex(finalSigBytes);
                        
                        return {
                            answer: Number(nonce),
                            signature: finalSigHex,
                            time: elapsed,
                            iterations: hashesComputed,
                            hashRate: Math.round(hashesComputed / (elapsed / 1000))
                        };
                    }
                    
                    nonce++;
                    
                    // Report progress
                    if (Date.now() - lastReportTime > 1000) {
                        lastReportTime = Date.now();
                        const elapsed = lastReportTime - startTime;
                        const hashRate = elapsed > 0 ? Math.round(hashesComputed / (elapsed / 1000)) : 0;
                        const progress = Math.min(100, (Number(nonce) / Number(maxNonce)) * 100);
                        
                        updatePowStatus(
                            `Mining... ${hashesComputed} hashes, ${hashRate} H/s`,
                            'mining',
                            progress
                        );
                    }
                    
                    // Timeout after 15 seconds
                    if (Date.now() - startTime > 15000) {
                        throw new Error('PoW solving timeout after 15 seconds');
                    }
                }
                
                throw new Error(`No solution found within ${maxNonce} iterations`);
            }
        }

        // ==============================
        // PURE JAVASCRIPT FALLBACK
        // ==============================

        class JavaScriptPoWSolver {
            constructor() {
                // Simple SHA3-256 implementation for fallback
                this.initializeSHA3();
            }

            initializeSHA3() {
                // Import SHA3 from CDN if not available
                if (typeof sha3_256 === 'undefined') {
                    console.log('Loading SHA3 library...');
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/js-sha3/0.9.3/sha3.min.js';
                    script.onload = () => console.log('SHA3 loaded');
                    document.head.appendChild(script);
                }
            }

            hexToBytes(hex) {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < hex.length; i += 2) {
                    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
                }
                return bytes;
            }

            bytesToHex(bytes) {
                return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            calculateTargetFromDifficulty(difficulty) {
                const maxHash = (1n << 256n) - 1n;
                const targetBigInt = maxHash / BigInt(difficulty);
                let targetHex = targetBigInt.toString(16);
                targetHex = targetHex.padStart(64, '0');
                return targetHex;
            }

            async solve(challenge, salt, difficulty, signature) {
                console.log('Using JavaScript fallback solver...');
                
                const targetHex = this.calculateTargetFromDifficulty(difficulty);
                const targetBigInt = BigInt('0x' + targetHex);
                
                const challengeBytes = this.hexToBytes(challenge);
                const saltBytes = this.hexToBytes(salt);
                
                const prefixBytes = new Uint8Array(challengeBytes.length + saltBytes.length);
                prefixBytes.set(challengeBytes);
                prefixBytes.set(saltBytes, challengeBytes.length);
                
                let nonce = 0n;
                const maxNonce = 50000n; // Very small for JS fallback
                const startTime = Date.now();
                let hashesComputed = 0;
                
                while (nonce < maxNonce) {
                    const nonceBytes = new Uint8Array(8);
                    const nonceView = new DataView(nonceBytes.buffer);
                    nonceView.setBigUint64(0, nonce, true);
                    
                    const data = new Uint8Array(prefixBytes.length + nonceBytes.length);
                    data.set(prefixBytes);
                    data.set(nonceBytes, prefixBytes.length);
                    
                    // Convert to string for SHA3 library
                    const dataStr = String.fromCharCode(...data);
                    const hashHex = sha3_256(dataStr);
                    const hashBigInt = BigInt('0x' + hashHex);
                    
                    hashesComputed++;
                    
                    if (hashBigInt < targetBigInt) {
                        const elapsed = Date.now() - startTime;
                        console.log(`JS fallback solution found! Nonce: ${nonce}`);
                        
                        // Calculate signature
                        const sigInput = signature + nonce.toString(16).padStart(16, '0');
                        const finalSigHex = sha3_256(sigInput);
                        
                        return {
                            answer: Number(nonce),
                            signature: finalSigHex,
                            time: elapsed,
                            iterations: hashesComputed,
                            hashRate: Math.round(hashesComputed / (elapsed / 1000))
                        };
                    }
                    
                    nonce++;
                    
                    if (hashesComputed % 1000 === 0) {
                        const elapsed = Date.now() - startTime;
                        const hashRate = elapsed > 0 ? Math.round(hashesComputed / (elapsed / 1000)) : 0;
                        const progress = Math.min(100, (Number(nonce) / Number(maxNonce)) * 100);
                        
                        updatePowStatus(
                            `JS Fallback... ${hashesComputed} hashes, ${hashRate} H/s`,
                            'mining',
                            progress
                        );
                    }
                    
                    if (Date.now() - startTime > 10000) {
                        throw new Error('JS solver timeout');
                    }
                }
                
                throw new Error('No solution found in JS fallback');
            }
        }

        // ==============================
        // UNIFIED SOLVER WITH FALLBACKS
        // ==============================

        class UnifiedPoWSolver {
            constructor() {
                this.wasmSolver = new WASMPoWSolver();
                this.jsSolver = new JavaScriptPoWSolver();
                this.currentSolver = null;
            }

            async initialize() {
                try {
                    const loaded = await this.wasmSolver.loadWasm('sha3_wasm_bg.7b9ca65ddd.wasm');
                    if (loaded) {
                        this.currentSolver = this.wasmSolver;
                        console.log('Using WASM solver');
                        return true;
                    }
                } catch (error) {
                    console.warn('WASM solver failed to initialize:', error);
                }
                
                console.log('Falling back to JavaScript solver');
                this.currentSolver = this.jsSolver;
                return false;
            }

            async solve(challenge, salt, difficulty, signature) {
                if (!this.currentSolver) {
                    await this.initialize();
                }
                
                try {
                    return await this.currentSolver.solve(challenge, salt, difficulty, signature);
                } catch (error) {
                    console.log(`${this.currentSolver.constructor.name} failed:`, error);
                    
                    // Switch to JS solver if WASM fails
                    if (this.currentSolver === this.wasmSolver) {
                        console.log('Switching to JavaScript solver...');
                        this.currentSolver = this.jsSolver;
                        return await this.jsSolver.solve(challenge, salt, difficulty, signature);
                    }
                    
                    throw error;
                }
            }
        }

            crypto.getRandomValues(randomBytes);
            const randomPart = Array.from(randomBytes)
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');
            
            return `${datePart}-${randomPart}`;
        }

        // ==============================
        // STREAM RESPONSE PARSER
        // ==============================

        async function parseStreamResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullResponse = '';
            let responseMessageId = null;
            
            responseDisplay.textContent = '';
            
            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.substring(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                
                                // Extract response_message_id if available
                                if (parsed.data?.biz_data?.response_message_id && !responseMessageId) {
                                    responseMessageId = parsed.data.biz_data.response_message_id;
                                    console.log('Found response_message_id:', responseMessageId);
                                }
                                
                                // Extract and display content
                                const choices = parsed.data?.biz_data?.choices;
                                if (choices && choices[0]?.message?.content) {
                                    const content = choices[0].message.content;
                                    fullResponse += content;
                                    responseDisplay.textContent = fullResponse;
                                }
                                
                                // Show usage stats if available
                                const usage = parsed.data?.biz_data?.usage;
                                if (usage) {
                                    responseDisplay.textContent = fullResponse + 
                                        `\n\n--- Token Usage ---\nPrompt: ${usage.prompt_tokens} | Completion: ${usage.completion_tokens} | Total: ${usage.total_tokens}`;
                                }
                                
                            } catch (e) {
                                // Not JSON, ignore
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Stream reading error:', error);
            }
            
            return { responseMessageId, fullResponse };
        }

                    },

                        target_path: '/api/v0/chat/completion'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Challenge request failed: ${response.status}`);
                }

                const result = await response.json();
                addDebugLog('Received PoW challenge', result);
                
                const challengeData = result.data?.biz_data?.challenge;
                if (!challengeData) {
                    throw new Error('Invalid challenge response structure');
                }
                
                if (challengeData.expire_at < Date.now()) {
                    throw new Error('Challenge expired');
                }
                
                return challengeData;

                throw error;
            }
        }

            const response = await fetch(COMPLETION_ENDPOINT, {

                const errorText = await response.text();
                addDebugLog('Error response', errorText);

                updateConversationWithResponse(responseMessageId);

                addDebugLog('Non streaming response:', data);
                return data;
            }

                showStatus('Please enter a message', 'error');
                messageInput.focus();
                return;
            }

            // Prepare UI

            responseDisplay.textContent = 'Working...';

                    await startNewConversation();
                    showStatus('New chat session started', 'info');
                }

                // Step 1: Request PoW challenge
                const challengeData = await requestPowChallenge();
                
                // Step 2: Solve PoW with WASM
                const { powHeader, iterations, time } = await solvePowWithWasm(challengeData);
                
                // Step 3: Send chat completion
                const result = await sendChatCompletion(message, powHeader);
                
                // Step 4: Display result
                if (typeof result === 'string') {
                    // Already displayed by parseStreamResponse
                    showStatus(`Success! PoW solved in ${time}ms (${iterations} iterations)`, 'success');
                } else if (result.choices && result.choices.length > 0) {
                    const reply = result.choices[0].message.content;
                    responseDisplay.textContent = reply;
                    
                    if (result.usage) {
                        responseDisplay.textContent += `\n\n--- Token Usage ---\nPrompt: ${result.usage.prompt_tokens} | Completion: ${result.usage.completion_tokens} | Total: ${result.usage.total_tokens}`;
                    }
                    
                    showStatus(`Success! PoW solved in ${time}ms (${iterations} iterations)`, 'success');
                } else if (result.message || result.content) {
                    responseDisplay.textContent = result.message || result.content;
                    showStatus('Success!', 'success');
                } else {
                    responseDisplay.textContent = JSON.stringify(result, null, 2);
                    showStatus('Success!', 'success');
                }
                
            } catch (error) {
                console.error('Request failed:', error);
                responseDisplay.textContent = `Error: ${error.message}\n\nPlease check:\n1. WASM file is in the correct location\n2. Your proxy server is running\n3. Browser console for detailed errors`;
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = originalText;
            }
        }

            }
        });

        // Example messages on double-click
        messageInput.addEventListener('dblclick', () => {
            const examples = [
                "Explain quantum computing in simple terms",
                "Write a Python function to calculate Fibonacci numbers",
                "What are the benefits of renewable energy?",
                "How does machine learning work?",
                "Create a short poem about technology"
            ];
            messageInput.value = examples[Math.floor(Math.random() * examples.length)];
            showStatus('Example loaded', 'info');
        });

        // ==============================
        // INITIALIZATION
        // ==============================

        // Update the initialization to handle WASM loading better
        window.addEventListener('DOMContentLoaded', () => {
            // Load token from URL hash if present
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            // Pre-fill with proxy URL
            customUrlInput.value = 'http://localhost:3000';
            
            // Update URL display
            currentUrlDisplay.textContent = getEndpointUrl();
            
            // Initialize config state
            initializeConfigState();
            
            // Pre-initialize solver
            setTimeout(() => {
                unifiedSolver.initialize()
                    .then(initialized => {
                        if (initialized) {
                            showStatus('WASM PoW solver ready', 'success');
                        } else {
                            showStatus('Using JavaScript PoW solver', 'warning');
                        }
                    })
                    .catch(error => {
                        console.error('Solver initialization error:', error);
                        showStatus(`Solver error: ${error.message}`, 'error');
                    });
            }, 500);
            
            // Show welcome message
            showStatus('Ready. Enter message to begin.', 'info');
        });
    </script>
</body>
</html>
